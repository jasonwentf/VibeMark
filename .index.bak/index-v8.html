<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI水印工具箱</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    :root {
      --app-bg: #f8f9fa;
      --panel-bg: #ffffff;
      --border-color: #dee2e6;
      --text-primary: #212529;
      --text-secondary: #6c757d;
      --accent: #0d6efd;
      --accent-hover: #0b5ed7;
      --drop-zone-bg: #f1f3f5;
      --drop-zone-border: #adb5bd;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --radius: 8px;
      --transition: 0.3s ease;
    }

    [data-theme="dark"] {
      --app-bg: #1a1a1a;
      --panel-bg: #252525;
      --border-color: #3a3a3a;
      --text-primary: #e9ecef;
      --text-secondary: #adb5bd;
      --drop-zone-bg: #2a2a2a;
      --drop-zone-border: #4a4a4a;
      --shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    * {
      box-sizing: border-box;
      transition: background-color var(--transition), border-color var(--transition), color var(--transition);
    }

    html {
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--app-bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding: 0.75rem 1.5rem;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .app-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .privacy-hint {
      font-size: 0.75rem;
      color: var(--text-secondary);
      padding: 0.25rem 0.5rem;
      background: var(--drop-zone-bg);
      border-radius: 4px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .lang-toggle, .github-link {
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text-primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .lang-toggle:hover, .github-link:hover {
      background: var(--drop-zone-bg);
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-primary);
    }

    .theme-toggle:hover {
      background: var(--drop-zone-bg);
    }

    .app-footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
      border-top: 1px solid var(--border-color);
      background: var(--panel-bg);
    }

    .app-footer a {
      color: var(--primary-color);
      text-decoration: none;
    }

    .app-footer a:hover {
      text-decoration: underline;
    }

    .app-main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(420px, 1fr);
      gap: 1.5rem;
      padding: 1.5rem;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      align-content: start;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-width: 0;
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-width: 0;
    }

    .panel-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem;
    }

    .preview-area {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--drop-zone-bg);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }

    .preview-placeholder {
      color: var(--text-secondary);
      text-align: center;
      padding: 2rem;
    }

    .preview-canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: none;
    }

    .thumbnail-strip {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding: 0.5rem 0;
      min-height: 70px;
    }

    .thumbnail-strip::-webkit-scrollbar {
      height: 6px;
    }

    .thumbnail-strip::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .thumbnail-item {
      position: relative;
      flex-shrink: 0;
      width: 60px;
      height: 60px;
      border: 2px solid transparent;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s, border-color 0.2s;
    }

    .thumb-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-size: 14px;
      line-height: 16px;
      text-align: center;
      cursor: pointer;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .thumbnail-item:hover .thumb-remove,
    .thumbnail-item.active .thumb-remove {
      opacity: 1;
    }

    [data-theme="dark"] .thumb-remove {
      border-color: rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.55);
    }

    .thumbnail-item:hover {
      opacity: 1;
    }

    .thumbnail-item.active {
      border-color: var(--accent);
      opacity: 1;
    }

    .thumbnail-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .step-indicator {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      background: var(--drop-zone-bg);
      color: var(--text-secondary);
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .step-item.active {
      background: var(--accent);
      color: white;
    }

    .step-item.completed {
      background: #198754;
      color: white;
    }

    .step-number {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .step-item.active .step-number,
    .step-item.completed .step-number {
      background: rgba(255,255,255,0.3);
    }

    .step-content {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    .step-content.active {
      display: flex;
    }

    .drop-zone {
      border: 2px dashed var(--drop-zone-border);
      border-radius: var(--radius);
      padding: 3rem 2rem;
      text-align: center;
      background: var(--drop-zone-bg);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(13, 110, 253, 0.05);
    }

    .drop-zone-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .drop-zone-text {
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .drop-zone-hint {
      font-size: 0.875rem;
      color: var(--text-secondary);
      opacity: 0.7;
    }

    .file-input {
      display: none;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-label {
      font-weight: 500;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .form-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn-group {
      display: flex;
      gap: 0.25rem;
    }

    .btn {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      background: var(--panel-bg);
      color: var(--text-primary);
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn:hover {
      background: var(--drop-zone-bg);
    }

    .btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }

    .select-wrapper {
      position: relative;
    }

    .select-wrapper select {
      width: 100%;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      background: var(--panel-bg);
      color: var(--text-primary);
      font-size: 0.875rem;
      cursor: pointer;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    @media (max-width: 1024px) {
      .app-main {
        grid-template-columns: 1fr;
      }

      .left-panel {
        flex: none;
      }

      .preview-area {
        aspect-ratio: 4 / 3;
      }

      .step-indicator {
        flex-wrap: wrap;
      }

      .step-item {
        flex: 1;
        min-width: 120px;
        justify-content: center;
      }
    }

    @media (max-width: 640px) {
      .app-header {
        padding: 0.75rem 1rem;
        align-items: flex-start;
      }

      .app-main {
        padding: 1rem;
        gap: 1rem;
      }

      .step-item {
        padding: 0.5rem;
        font-size: 0.75rem;
      }

      .step-item span:not(.step-number) {
        display: none;
      }

      .drop-zone {
        padding: 2rem 1rem;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <h1 class="app-title">AI水印工具箱</h1>
      <span class="privacy-hint">🔒 所有数据都在您的本地处理</span>
    </div>
    <div class="header-right">
      <button class="lang-toggle" id="langToggle">EN</button>
      <a class="github-link" href="https://github.com/JasonWenTheFox" target="_blank" rel="noopener">
        <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub
      </a>
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
    </div>
  </header>

  <main class="app-main">
    <aside class="left-panel">
      <div class="panel-card">
        <div class="preview-area" id="previewArea">
          <div class="preview-placeholder" id="previewPlaceholder">
            <div class="drop-zone-icon">🖼️</div>
            <p>预览区域</p>
            <p class="drop-zone-hint">导入图片后在此预览效果</p>
          </div>
          <canvas class="preview-canvas" id="previewCanvas"></canvas>
        </div>
      </div>
      <div class="panel-card">
        <div class="thumbnail-strip" id="thumbnailStrip"></div>
      </div>
    </aside>

    <section class="right-panel">
      <div class="panel-card" style="flex: 1; display: flex; flex-direction: column;">
        <nav class="step-indicator" id="stepIndicator">
          <div class="step-item active" data-step="1">
            <span class="step-number">1</span>
            <span>导入图片</span>
          </div>
          <div class="step-item" data-step="2">
            <span class="step-number">2</span>
            <span>调整尺寸</span>
          </div>
          <div class="step-item" data-step="3">
            <span class="step-number">3</span>
            <span>添加水印</span>
          </div>
          <div class="step-item" data-step="4">
            <span class="step-number">4</span>
            <span>导出保存</span>
          </div>
        </nav>

        <div class="step-content active" data-step="1">
          <div class="drop-zone" id="dropZone">
            <div class="drop-zone-icon">📁</div>
            <p class="drop-zone-text">拖拽图片到这里，或点击选择文件</p>
            <p class="drop-zone-hint">支持 JPG、PNG、WebP 格式，可批量添加</p>
            <p class="drop-zone-hint">也可以直接 Ctrl+V 粘贴图片</p>
          </div>
          <input type="file" class="file-input" id="fileInput" accept="image/*" multiple>
        </div>

        <div class="step-content" data-step="2">
          <div class="form-group">
            <label class="form-label" id="lblTargetRes">目标分辨率</label>
            <div class="btn-group">
              <button class="btn" data-res="1024">1K</button>
              <button class="btn active" data-res="2048">2K</button>
              <button class="btn" data-res="4096">4K</button>
              <button class="btn" data-res="original">原尺寸</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" id="lblAspectRatio">宽高比</label>
            <div class="btn-group">
              <button class="btn active" data-ratio="1:1">1:1</button>
              <button class="btn" data-ratio="16:9">16:9</button>
              <button class="btn" data-ratio="9:16">9:16</button>
              <button class="btn" data-ratio="4:3">4:3</button>
              <button class="btn" data-ratio="3:2">3:2</button>
              <button class="btn" data-ratio="original">原比例</button>
            </div>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="skipResize">
            <label for="skipResize" id="lblSkipResize">跳过此步骤（保持原尺寸）</label>
          </div>
        </div>

        <div class="step-content" data-step="3">
          <div class="form-group">
            <label class="form-label" id="lblVendor">厂商</label>
            <div class="select-wrapper">
            <select id="vendorSelect">
              <option value="google">Google</option>
              <option value="bytedance">字节跳动</option>
              <option value="alibaba">阿里</option>
              <option value="baidu">百度</option>
              <option value="zhipu">智谱</option>
              <option value="tencent">腾讯</option>
            </select>
            </div>
          </div>
          <div class="form-group" id="productGroup" style="display: none;">
            <label class="form-label" id="lblProduct">产品</label>
            <div class="select-wrapper">
            <select id="productSelect">
              <option value="doubao">豆包</option>
            </select>
            </div>
          </div>
          <div class="form-group" id="variantGroup">
            <label class="form-label" id="lblVariant">版本</label>
            <div class="select-wrapper">
              <select id="variantSelect">
                <option value="current">当前版</option>
                <option value="v1">旧版v1 (2025.3)</option>
                <option value="v3">旧版v3 (2025.5)</option>
              </select>
            </div>
          </div>
          <div class="checkbox-group" id="topLeftOption" style="display: none;">
            <input type="checkbox" id="addTopLeft">
            <label for="addTopLeft" id="lblTopLeft">添加左上角"AI生成"标识</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="autoScaleWatermark" checked>
            <label for="autoScaleWatermark" id="lblAutoScale">自动匹配水印尺寸（推荐）</label>
          </div>
        </div>

        <div class="step-content" data-step="4">
          <div class="form-group">
            <label class="form-label" id="lblFormat">输出格式</label>
            <div class="btn-group">
              <button class="btn active" data-format="png">PNG</button>
              <button class="btn" data-format="jpg">JPG</button>
              <button class="btn" data-format="webp">WebP</button>
            </div>
          </div>
          <div class="form-group" id="qualityGroup" style="display: none;">
          <label class="form-label"><span id="lblQuality">质量</span>: <span id="qualityValue">95</span>%</label>
          <input type="range" id="qualitySlider" min="50" max="100" value="95">
          </div>
          <div class="form-group">
            <button class="btn btn-primary" id="exportBtn" style="width: 100%; padding: 1rem;">
              导出图片
            </button>
          </div>
        </div>

        <div class="nav-buttons">
          <button class="btn" id="prevBtn" disabled>上一步</button>
          <button class="btn btn-primary" id="nextBtn">下一步</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <span>by <a href="https://github.com/JasonWenTheFox" target="_blank" rel="noopener">JasonWen</a> and <a href="https://opencode.ai/" target="_blank" rel="noopener">opencode</a></span>
  </footer>

    function init() {

    function toggleTheme() {
      state.darkMode = !state.darkMode;
      localStorage.setItem('darkMode', state.darkMode);
      document.documentElement.setAttribute('data-theme', state.darkMode ? 'dark' : '');
      $('#themeToggle').textContent = state.darkMode ? '☀️' : '🌙';

    function setupStepNavigation() {
      $$('.step-item').forEach(item => {
        item.addEventListener('click', () => {
          const step = parseInt(item.dataset.step);
          if (step <= state.currentStep || state.files.length > 0) {
            goToStep(step);
          }
        });
      });

      $('#prevBtn').addEventListener('click', () => goToStep(state.currentStep - 1));
      $('#nextBtn').addEventListener('click', () => {
        if (state.currentStep < 4) {
          goToStep(state.currentStep + 1);
        } else {
          exportImages();
        }
      });
    }

    function goToStep(step) {
      if (step < 1 || step > 4) return;
      state.currentStep = step;

      $$('.step-item').forEach((item, i) => {
        item.classList.remove('active', 'completed');
        if (i + 1 < step) item.classList.add('completed');
        if (i + 1 === step) item.classList.add('active');
      });

      $$('.step-content').forEach(content => {
        content.classList.remove('active');
        if (parseInt(content.dataset.step) === step) {
          content.classList.add('active');
        }
      });

      $('#prevBtn').disabled = step === 1;
      $('#nextBtn').textContent = step === 4 ? '导出' : '下一步';
      
      renderPreview();
    }

    function setupDropZone() {
      const dropZone = $('#dropZone');
      const fileInput = $('#fileInput');

      dropZone.addEventListener('click', () => fileInput.click());

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
      });

      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
      });

      fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
      });

      document.addEventListener('paste', (e) => {
        const items = e.clipboardData?.items;
        if (!items) return;
        const files = [];
        for (const item of items) {
          if (item.type.startsWith('image/')) {
            files.push(item.getAsFile());
          }
        }
        if (files.length) handleFiles(files);
      });
    }

    function handleFiles(fileList) {
      const validFiles = Array.from(fileList).filter(f => f.type.startsWith('image/'));
      if (!validFiles.length) return;

      Promise.all(validFiles.map(file => loadImageFile(file))).then(images => {
        images.forEach(img => {
          if (img) state.files.push(img);
        });
        if (state.files.length > 0) {
          state.currentIndex = state.files.length - images.filter(Boolean).length;
          renderThumbnails();
          selectImage(state.currentIndex);
        }
      });
    }

    async function loadImageFile(file) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const id = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString() + Math.random();
            resolve({
              id,
              filename: file.name.replace(/\.[^.]+$/, ''),
              original: img,
              width: img.naturalWidth,
              height: img.naturalHeight,
              dataUrl: e.target.result
            });
          };
          img.onerror = () => resolve(null);
          img.src = e.target.result;
        };
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    }

    function renderThumbnails() {
      const strip = $('#thumbnailStrip');
      strip.innerHTML = '';
      state.files.forEach((file, index) => {
        const thumb = document.createElement('div');
        thumb.className = 'thumbnail-item' + (index === state.currentIndex ? ' active' : '');
        thumb.dataset.index = index;

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'thumb-remove';
        removeBtn.textContent = '×';
        removeBtn.title = t('remove');
        removeBtn.setAttribute('aria-label', t('remove'));
        removeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          removeFile(index);
        });
        thumb.appendChild(removeBtn);

        const img = document.createElement('img');
        img.src = file.dataUrl;
        img.alt = file.filename;
        thumb.appendChild(img);
        thumb.addEventListener('click', () => selectImage(index));
        strip.appendChild(thumb);
      });
    }

    function removeFile(index) {
      if (index < 0 || index >= state.files.length) return;

      state.files.splice(index, 1);

      if (state.files.length === 0) {
        state.currentIndex = 0;
        renderThumbnails();
        renderPreview();
        return;
      }

      if (index < state.currentIndex) {
        state.currentIndex -= 1;
      } else if (index === state.currentIndex) {
        state.currentIndex = Math.min(state.currentIndex, state.files.length - 1);
      }

      renderThumbnails();
      selectImage(state.currentIndex);
    }

    function selectImage(index) {
      if (index < 0 || index >= state.files.length) return;
      state.currentIndex = index;

      $$('.thumbnail-item').forEach((t, i) => {
        t.classList.toggle('active', i === index);
      });

      renderPreview();
    }

    function renderPreview() {
      const file = state.files[state.currentIndex];
      if (!file) {
        $('#previewPlaceholder').style.display = 'flex';
        $('#previewCanvas').style.display = 'none';
        return;
      }

      $('#previewPlaceholder').style.display = 'none';
      const canvas = $('#previewCanvas');
      canvas.style.display = 'block';
      
      const ctx = canvas.getContext('2d');
      const { resizeEnabled, targetRes, aspectRatio } = state.settings;
      
      let srcX = 0, srcY = 0, srcW = file.width, srcH = file.height;
      let dstW = file.width, dstH = file.height;
      
      if (resizeEnabled && state.currentStep >= 2) {
        const dims = calculateResizeDimensions(file.width, file.height, targetRes, aspectRatio);
        srcX = dims.srcX;
        srcY = dims.srcY;
        srcW = dims.srcW;
        srcH = dims.srcH;
        dstW = dims.dstW;
        dstH = dims.dstH;
      }
      
      canvas.width = dstW;
      canvas.height = dstH;
      ctx.drawImage(file.original, srcX, srcY, srcW, srcH, 0, 0, dstW, dstH);

      if (state.currentStep >= 3) {
        applyWatermarks(canvas);
      }
    }

    function calculateResizeDimensions(origW, origH, targetRes, aspectRatio) {
      // 1) Source rect: decided only by aspect ratio (crop).
      let srcX = 0, srcY = 0, srcW = origW, srcH = origH;

      if (aspectRatio && aspectRatio !== 'original') {
        const [rw, rh] = aspectRatio.split(':').map(Number);
        const targetRatio = rw / rh;
        const origRatio = origW / origH;

        if (origRatio > targetRatio) {
          // Too wide -> crop width
          srcH = origH;
          srcW = Math.round(origH * targetRatio);
          srcX = Math.round((origW - srcW) / 2);
          srcY = 0;
        } else {
          // Too tall -> crop height
          srcW = origW;
          srcH = Math.round(origW / targetRatio);
          srcX = 0;
          srcY = Math.round((origH - srcH) / 2);
        }
      }

      // 2) Destination size: scale the whole (cropped) image so the SHORT edge matches targetRes.
      let dstW = srcW;
      let dstH = srcH;
      if (targetRes) {
        const shortEdge = Math.min(dstW, dstH);
        const scale = targetRes / shortEdge;
        dstW = Math.max(1, Math.round(dstW * scale));
        dstH = Math.max(1, Math.round(dstH * scale));
      }

      return { srcX, srcY, srcW, srcH, dstW, dstH };
    }

    const watermarkImageCache = {};

    function loadWatermarkImage(key) {
      if (watermarkImageCache[key]) {
        return Promise.resolve(watermarkImageCache[key]);
      }
      const data = WATERMARK_DATA[key];
      if (!data || !data.dataUrl) return Promise.resolve(null);
      
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          watermarkImageCache[key] = img;
          resolve(img);
        };
        img.onerror = () => resolve(null);
        img.src = data.dataUrl;
      });
    }

    async function applyWatermarks(canvas) {
      const ctx = canvas.getContext('2d');
      const { vendor, product, variant, topLeftEnabled, autoScale } = state.settings;
      
      let mainKey, topLeftKey;
      
      if (vendor === 'google') {
        const variantMap = { current: 'gemini-current', v1: 'gemini-v1', v3: 'gemini-v3' };
        mainKey = variantMap[variant] || 'gemini-current';
      } else {
        const vend = WATERMARK_CATALOG && WATERMARK_CATALOG[vendor];
        const prod = vend && vend.products && vend.products[product];
        if (prod) {
          mainKey = prod.mainWatermark;
          if (topLeftEnabled && prod.topLeftWatermark) {
            topLeftKey = prod.topLeftWatermark;
          }
        }
      }
      
      if (mainKey) await drawWatermark(ctx, canvas, mainKey, autoScale);
      if (topLeftKey) await drawWatermark(ctx, canvas, topLeftKey, autoScale);
    }

    async function drawWatermark(ctx, canvas, key, autoScale) {
      const wmData = WATERMARK_DATA[key];
      if (!wmData) return;
      
      const wmImg = await loadWatermarkImage(key);
      if (!wmImg) return;
      
      const imgShortSide = Math.min(canvas.width, canvas.height);
      let scale = 1;
      
      if (autoScale) {
        const baseSize = wmData.templateSize || 2048;
        scale = imgShortSide / baseSize;
      }
      
      const wmW = wmData.width * scale;
      const wmH = wmData.height * scale;
      const marginX = wmData.marginX * scale;
      const marginY = wmData.marginY * scale;
      
      let x, y;
      const anchor = wmData.anchor || 'bottom-right';
      const [anchorY, anchorX] = anchor.split('-');
      
      if (anchorX === 'left') x = marginX;
      else if (anchorX === 'right') x = canvas.width - wmW - marginX;
      else x = (canvas.width - wmW) / 2;
      
      if (anchorY === 'top') y = marginY;
      else if (anchorY === 'bottom') y = canvas.height - wmH - marginY;
      else y = (canvas.height - wmH) / 2;
      
      ctx.drawImage(wmImg, x, y, wmW, wmH);
    }

      $$('[data-res]').forEach(btn => {
        btn.addEventListener('click', () => {
          $$('[data-res]').forEach(b => b.classList.remove('active'));

    function updateResizeUI() {
      const skip = !state.settings.resizeEnabled;

      $$('[data-res]').forEach(btn => { btn.disabled = skip; });
      $$('[data-ratio]').forEach(btn => { btn.disabled = skip; });

      if (skip) {
        if (!state._savedResize) {
          state._savedResize = {
            targetRes: state.settings.targetRes,
            aspectRatio: state.settings.aspectRatio
          };
        }

        state.settings.targetRes = null;
        state.settings.aspectRatio = 'original';

        $$('[data-res]').forEach(b => b.classList.toggle('active', b.dataset.res === 'original'));
        $$('[data-ratio]').forEach(b => b.classList.toggle('active', b.dataset.ratio === 'original'));
        return;
      }

      const saved = state._savedResize;
      state._savedResize = null;
      if (saved) {
        state.settings.targetRes = saved.targetRes;
        state.settings.aspectRatio = saved.aspectRatio;
      }

      $$('[data-res]').forEach(b => {
        const isOriginal = b.dataset.res === 'original';
        const isActive = (isOriginal && !state.settings.targetRes) || (!isOriginal && String(state.settings.targetRes) === b.dataset.res);
        b.classList.toggle('active', isActive);
      });

      $$('[data-ratio]').forEach(b => b.classList.toggle('active', b.dataset.ratio === state.settings.aspectRatio));
    }

    function populateProductSelect(vendor) {
      const select = $('#productSelect');
      if (!select) return;

      const vend = WATERMARK_CATALOG && WATERMARK_CATALOG[vendor];
      const products = vend && vend.products;
      const keys = products ? Object.keys(products) : [];

      select.innerHTML = '';
      keys.forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = products[key].name || key;
        select.appendChild(opt);
      });

      if (keys.length === 0) {
        return;
      }

      const current = state.settings.product;
      const next = keys.includes(current) ? current : keys[0];
      state.settings.product = next;
      select.value = next;
    }

    function updateTopLeftOption(prod) {
      const option = $('#topLeftOption');
      const checkbox = $('#addTopLeft');
      const hasTopLeft = !!(prod && prod.hasTopLeftOption && prod.topLeftWatermark);

      if (option) option.style.display = hasTopLeft ? 'flex' : 'none';

      if (!checkbox) return;

      if (!hasTopLeft) {
        checkbox.checked = false;
        state.settings.topLeftEnabled = false;
        return;
      }

      const enabled = prod.defaultTopLeftEnabled === true;
      checkbox.checked = enabled;
      state.settings.topLeftEnabled = enabled;
    }

    function updateVendorUI() {
      const vendor = state.settings.vendor;
      const productGroup = $('#productGroup');
      const variantGroup = $('#variantGroup');
      const variantSelect = $('#variantSelect');

      if (variantGroup) {
        variantGroup.style.display = vendor === 'google' ? 'block' : 'none';
      }

      if (vendor === 'google') {
        if (productGroup) productGroup.style.display = 'none';
        if (variantSelect) variantSelect.value = state.settings.variant;
        updateTopLeftOption(null);
        return;
      }

      const vend = WATERMARK_CATALOG && WATERMARK_CATALOG[vendor];
      const hasProducts = !!(vend && vend.products && Object.keys(vend.products).length > 0);

      if (productGroup) productGroup.style.display = hasProducts ? 'block' : 'none';
      if (!hasProducts) {
        updateTopLeftOption(null);
        return;
      }

      populateProductSelect(vendor);
      const prod = vend.products[state.settings.product];
      updateTopLeftOption(prod);
    }

    async function exportImages() {
      if (state.files.length === 0) {
        alert(t('pleaseImport'));
        return;
      }

      const { format, quality } = state.settings;
      const mimeType = format === 'jpg' ? 'image/jpeg' : format === 'webp' ? 'image/webp' : 'image/png';
      const ext = format === 'jpg' ? 'jpg' : format;
      
      $('#exportBtn').disabled = true;
      $('#exportBtn').textContent = t('processing');

      try {
        if (state.files.length === 1) {
          const blob = await renderToBlob(state.files[0], mimeType, quality / 100);
          downloadBlob(blob, `${state.files[0].filename}_watermarked.${ext}`);
        } else {
          const JSZip = window.JSZip || (await loadJSZip());
          const zip = new JSZip();
          
          for (let i = 0; i < state.files.length; i++) {
            $('#exportBtn').textContent = t('processingProgress')
              .replace('{current}', String(i + 1))
              .replace('{total}', String(state.files.length));
            const blob = await renderToBlob(state.files[i], mimeType, quality / 100);
            zip.file(`${state.files[i].filename}_watermarked.${ext}`, blob);
          }
          
          const zipBlob = await zip.generateAsync({ type: 'blob' });
          downloadBlob(zipBlob, 'watermarked_images.zip');
        }
      } catch (err) {
        console.error('Export error:', err);
        alert(t('exportFailed').replace('{message}', err.message));
      }

      $('#exportBtn').disabled = false;
      $('#exportBtn').textContent = t('exportBtn');
    }

    async function renderToBlob(file, mimeType, quality) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const { resizeEnabled, targetRes, aspectRatio } = state.settings;
      
      let srcX = 0, srcY = 0, srcW = file.width, srcH = file.height;
      let dstW = file.width, dstH = file.height;
      
      if (resizeEnabled) {
        const dims = calculateResizeDimensions(file.width, file.height, targetRes, aspectRatio);
        srcX = dims.srcX;
        srcY = dims.srcY;
        srcW = dims.srcW;
        srcH = dims.srcH;
        dstW = dims.dstW;
        dstH = dims.dstH;
      }
      
      canvas.width = dstW;
      canvas.height = dstH;
      ctx.drawImage(file.original, srcX, srcY, srcW, srcH, 0, 0, dstW, dstH);
      
      await applyWatermarksToCanvas(canvas);
      
      return new Promise(resolve => {
        canvas.toBlob(resolve, mimeType, quality);
      });
    }

    async function applyWatermarksToCanvas(canvas) {
      const ctx = canvas.getContext('2d');
      const { vendor, product, variant, topLeftEnabled, autoScale } = state.settings;
      
      let mainKey, topLeftKey;
      
      if (vendor === 'google') {
        const variantMap = { current: 'gemini-current', v1: 'gemini-v1', v3: 'gemini-v3' };
        mainKey = variantMap[variant] || 'gemini-current';
      } else {
        const vend = WATERMARK_CATALOG && WATERMARK_CATALOG[vendor];
        const prod = vend && vend.products && vend.products[product];
        if (prod) {
          mainKey = prod.mainWatermark;
          if (topLeftEnabled && prod.topLeftWatermark) {
            topLeftKey = prod.topLeftWatermark;
          }
        }
      }
      
      if (mainKey) await drawWatermark(ctx, canvas, mainKey, autoScale);
      if (topLeftKey) await drawWatermark(ctx, canvas, topLeftKey, autoScale);
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    async function loadJSZip() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js';
        script.onload = () => resolve(window.JSZip);
        script.onerror = () => reject(new Error('Failed to load JSZip'));
        document.head.appendChild(script);
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
